<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const previewImg = document.getElementById('preview-img');
const infoText = document.getElementById('info-text');

const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');
const elevCanvas = document.getElementById('elevCanvas');
const elevCtx = elevCanvas.getContext('2d');

let images = [];
let visibleImages = [];
let clusters = [];
let selectedImage = null;
let currentPreview = null;
let hasUrlCoordinates = false;
let lassoBoxes = [];    // Each completed selection box, as 4 lat/lon corners, drawn on the map
let lassoSelected = []; // Photos from all boxes so far, duplicates removed
let altGlobalMin = Infinity, altGlobalMax = -Infinity; // Elevation range across all images



let view = {
    lat: 45.624897, lon: -75.239783, latHeight: 7, // Fallback location
    dragging: false,
    dragStart: { x: 0, y: 0 },
    dragOffset: { x: 0, y: 0 },
    pinchInitialDist: 0,
    pinchScale: 1.0,
    pinchCenter: { x: 0, y: 0 },
    pinchStartCenter: { x: 0, y: 0 }
};

updateLatScale(view.latHeight)

function saveView() {
    // Scale is simple: total vertical meters
    const heightInMeters = Math.round(view.latHeight * 111120);

    localStorage.setItem('mapView', JSON.stringify({
        lat: view.lat,
        lon: view.lon,
        latHeight: view.latHeight
    }));

    // Base Google Maps location string
    const locValue = `@${view.lat.toFixed(6)},${view.lon.toFixed(6)},${heightInMeters}m`;

    // --- Process 't' (Time Histogram Zoom) ---
    // Check if the scale is locked (not null or undefined)
    const thStart = overlayUI.lockedStartMs != null;
    const thEnd = overlayUI.lockedEndMs != null;
    let timeUrlPart = ""

    if (thStart || thEnd) {
        timeUrlPart += `,t:`;
        if (thStart) timeUrlPart += Math.floor(overlayUI.lockedStartMs / 1000000);
        timeUrlPart += `-`;
        if (thEnd) timeUrlPart += Math.floor(overlayUI.lockedEndMs / 1000000);
    }

    // --- Process 'f' (Time Filter Markers) ---
    // Safely check if markers are moved inward from the unbounded 1980/2100 defaults (or Infinity)
    const tfStart = overlayUI.filterStartMs > startOfTimeMs
    const tfEnd = overlayUI.filterEndMs     < endOfTimeMs

    if (tfStart || tfEnd) {
        timeUrlPart += `,f:`;
        if (tfStart) timeUrlPart += Math.floor(overlayUI.filterStartMs / 1000000);
        timeUrlPart += `-`;
        if (tfEnd) timeUrlPart += Math.floor(overlayUI.filterEndMs / 1000000);
    }

    // --- Process 'e' (Elevation filter, meters; ~ separates min and max) ---
    if (elevUI.filterMin !== null || elevUI.filterMax !== null) {
        timeUrlPart += `,e:` + (elevUI.filterMin !== null ? elevUI.filterMin : '') + `~` + (elevUI.filterMax !== null ? elevUI.filterMax : '');
    }

    // Update the browser URL without reloading the page
    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?" + locValue + timeUrlPart;
    history.replaceState(null, '', newUrl);

}

// --- DATA LOADING ---
function initData() {
    baseMap.init(); // Load basemaps
    // Alert the user if gpstagged.txt (containing rawImageData) is missing
    if (typeof rawImageData !== 'undefined') {
        parseData(rawImageData);

        if (!hasUrlCoordinates && images.length > 0) {
            // Figure out some default coordinates to use.

            // Find the 5% and 95% longitude bounds
            const lon5 = images[Math.floor(images.length * 0.05)].lon;
            const lon95 = images[Math.min(images.length - 1, Math.floor(images.length * 0.95))].lon;

            view.lon = (lon5 + lon95) / 2; // Center view's longitude betwen 9 and 95% bounds

            // For latitude center, computer average latitude
            let sumLat = 0;
            for (let i = 0; i < images.length; i++) sumLat += images[i].lat;
            view.lat = sumLat / images.length;

            // Compute view.latHeight to fit the longitude spread & ensure minimum width
            const lonWidth = Math.max(0.001, lon95 - lon5);

            // Convert longitude width to latitude height using window aspect ratio and Mercator distortion
            view.latHeight = lonWidth * Math.cos(view.lat * Math.PI / 180) * (window.innerHeight / window.innerWidth);
        }

        updateVisibleData();
    } else {
        alert("gpstagged.txt not found.\nPlease run gathergps.html and copy gpstagged.txt to the root of your images directory, same directory as gps.html");
    }
}

function parseData(text) {
    const lines = text.trim().split(/\r?\n/);
    images = [];

    for (let i = 0; i < lines.length; i++) {
        let path = lines[i].trim();

        // Skip JS wrapper lines if they are included in the string
        if (!path || path.startsWith("const") || path.endsWith("`;")) continue;

        const p = lines[++i].match(/\d+/g); // Grab the numbers
        let ms = new Date(p[0], p[1] - 1, p[2], p[3], p[4], p[5]).getTime();

        let gl = (lines[++i] || "");
        let cl = (lines[++i] || "").replace('Camera: ', '').trim();
        const m = gl.match(/GPS:\s*([\d.-]+),\s*([\d.-]+)(?:,\s*alt=(-?[\d.]+))?/);

        if (m) {
            const altVal = (m[3] !== undefined && isFinite(parseFloat(m[3]))) ? parseFloat(m[3]) : null;
            if (altVal !== null) { if (altVal < altGlobalMin) altGlobalMin = altVal; if (altVal > altGlobalMax) altGlobalMax = altVal; }
            // Build the element clearly before pushing
            let imageElement = {
                path: path,
                timeMs: ms,
                lat: parseFloat(m[1]),
                lon: parseFloat(m[2]),
                camera: cl || "Unknown",
                alt: altVal,
                hl: 0
            };
            images.push(imageElement);
        }
    }
    images.sort((a, b) => a.lon - b.lon || a.lat - b.lat || a.timeMs - b.timeMs);
}

// --- COORDINATE TRANSFORMATIONS ---
function lat2mercatorY(lat) {
    // Converts a geographic Latitude into a normalized Mercator Y value (0.0 to 1.0)
    const rad = lat * Math.PI / 180;
    return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2;
}

// Converts a normalized Mercator Y value back into a geographic Latitude
function mercatorY2lat(y){
// Converts a normalized Mercator Y value back into a geographic Latitude
    const n = Math.PI - 2 * Math.PI * y;
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function latLon2xy(lat, lon){
// Latitude and Longitude to X Y pixel screen coordinates
    const centerMercatorY = lat2mercatorY(view.lat);

    // Scale horizontal longitude linearly
    const x = canvas.width / 2 + (lon - view.lon) * view.lonScale;

    // Position vertical pixels using the Mercator logarithmic curve
    const targetMercatorY = lat2mercatorY(lat);
    const mercatorDeltaY = targetMercatorY - centerMercatorY;
    const pixelScaleY = canvas.height / view.yHeight;
    const y = canvas.height / 2 + (mercatorDeltaY * pixelScaleY);

    return { x, y };
}

function xy2latLon(x, y){
// X Y pixel screen coordinates to Latitude and Longitude

    // Reverse longitude mapping
    const lon = view.lon + (x - canvas.width / 2) / view.lonScale;

    // Reverse Mercator Y curve back to actual latitude degrees
    const centerMercatorY = lat2mercatorY(view.lat);
    const pixelScaleY = canvas.height / view.yHeight;
    const targetMercatorY = centerMercatorY + (y - canvas.height / 2) / pixelScaleY;
    const lat = mercatorY2lat(targetMercatorY);

    return { lat, lon };
}

function updateLatScale(newLatHeight){
// On zooming in and out, update variables to new scale.
    // Establish the current Mercator height footprint
    view.latHeight = newLatHeight;
    const topLat = view.lat + (newLatHeight / 2);
    const bottomLat = view.lat - (newLatHeight / 2);

    view.yHeight = lat2mercatorY(bottomLat) - lat2mercatorY(topLat);

    // Synchronize the horizontal pixels-per-degree multiplier
    // At Web Mercator scale, the full world width matches the full world height
    const totalWorldPixelHeight = canvas.height / view.yHeight;
    view.lonScale = totalWorldPixelHeight / 360;
}


const chronological = {
// Object for cronologically slecting previous and next image in visbleImages using cursor keys
    chronoIndexArray: null,

    clear() {
        console.log("Choronological clear")
        chronological.chronoIndexArray = null;
    },

    buildIndex: function() {
        if (chronological.chronoIndexArray) return chronological.chronoIndexArray;
        // Build an array linking the actual time to the original image index, then sort it
        console.log("(Re)build chronological index array")
        chronological.chronoIndexArray = Array.from(visibleImages.keys());
        chronological.chronoIndexArray.sort((a, b) => {
            return visibleImages[a].timeMs - visibleImages[b].timeMs
        });
        return chronological.chronoIndexArray
    },

    getNavIndex(currentIndex, action) {
        if (visibleImages.length === 0) return null;

        let chronoIndexArray = chronological.buildIndex();

        // Absolute navigation works even if currentIndex is -1
        if (action === "first") return chronoIndexArray[0];
        if (action === "last") return chronoIndexArray[chronoIndexArray.length - 1];

        if (currentIndex === -1){ // if current falls outside time filtered range, pick first or last
            return action < 0 ? chronoIndexArray[0] : chronoIndexArray.at(-1);
        }

        const currentPos = chronoIndexArray.indexOf(currentIndex);
        if (currentPos === -1) return chronoIndexArray[0]; // Lookup failed, just return soething.

        let nextPos = currentPos + action;
        if (nextPos < 0) nextPos = 0;
        if (nextPos >= chronoIndexArray.length) nextPos = chronoIndexArray.length - 1;

        return chronoIndexArray[nextPos];
    },

    findNearestMsImage: function(timeMs) {
        let chronoIndexArray = chronological.buildIndex();

        if (chronoIndexArray.length === 0) return null;

        // Binary search to find next highest and next lowest (as exact match is unlikely)
        let low = 0;
        let high = chronoIndexArray.length - 1;

        while (low < high - 1) { // loop runs until low and high are 1 index apart
            let mid = Math.floor((low + high) / 2);
            let midMs = visibleImages[chronoIndexArray[mid]].timeMs;

            if (midMs < timeMs) {
                low = mid;  // Do NOT add 1. Keep 'mid' as our safe lower boundary.
            } else {
                high = mid; // Do NOT subtract 1. Keep 'mid' as our safe upper boundary.
            }
        }

        // 'high' is the closest smaller value, 'low' is the closest larger value.
        let diffLow  = Math.abs(visibleImages[chronoIndexArray[low ]].timeMs - timeMs);
        let diffHigh = Math.abs(visibleImages[chronoIndexArray[high]].timeMs - timeMs);
        let closestEntry = diffLow < diffHigh ? chronoIndexArray[low] : chronoIndexArray[high];

        return visibleImages[closestEntry];
    }

};

const baseMap_OpenStreetMaps = {
// Object for drawing OpenStreetMap tiles dynamically on the background
    tileCache: new Map(),

    init() {
        console.log("OpenStreetMap provider initialized.");
    },

    // Standard cryptographic/mathematical hash helper to map Lat/Lon to OSM tile grids
    lon2tile(lon, zoom) {
        return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
    },

    lat2tile(lat, zoom) {
        return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
    },

    // Reverse calculation to position tiles correctly on screen relative to your linear map grid
    tile2lon(x, z) {
        return x / Math.pow(2, z) * 360 - 180;
    },

    tile2lat(y, z) {
        const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
        return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    },

    draw() {
        const zoom = Math.max(0, Math.min(19, Math.round(Math.log2(180 / view.latHeight))));

        const topLeftGeo = xy2latLon(0, 0);
        const bottomRightGeo = xy2latLon(canvas.width, canvas.height);

        const minTileX = this.lon2tile(topLeftGeo.lon, zoom);
        const maxTileX = this.lon2tile(bottomRightGeo.lon, zoom);
        const minTileY = this.lat2tile(topLeftGeo.lat, zoom);
        const maxTileY = this.lat2tile(bottomRightGeo.lat, zoom);

        ctx.save();

        // Maps input range 179-255 onto output range 0-142
        // Dim the bright values into a low range first, then expand the contrast pivot point
        let haveFilter = false;
        if ('filter' in ctx){
            // Use contrast adjustment to make regular street map basemap tiles darker.
            ctx.filter = 'brightness(40%) contrast(250%) brightness(180%)';
            haveFilter = true;
        }

        // API key for base maps from carto.com.
        // If you plan on using this a lot or re-publish a modified version,
        // please get your own free API key at https://carto.com/basemaps/apikey/
        let apiKey = "?key=cb1_28qx_1_a0c46e683e2c956617413463"
        // ?key=cb1_28qx_1_a0c46e683e2c956617413463 new
        // OLD ?key=cb1_3vl4_1_daf611a0c786d6b469524f1d
        let baseURL = "https://basemaps.cartocdn.com/rastertiles/"

        for (let x = minTileX; x <= maxTileX; x++) {
            for (let y = minTileY; y <= maxTileY; y++) {
                const tileKey = `${zoom},${x},${y}`;
                let img = this.tileCache.get(tileKey);

                if (!img) {
                    img = new Image();
                    img.crossOrigin = "Anonymous";
                    if (haveFilter){
                        // Use regular base map, but darkened via ctx.filter
                        img.src = baseURL + `voyager/${zoom}/${x}/${y}.png`+apiKey;
                    }else{
                        // Use the overly dark basemap tiles when image fiter unavailable
                        img.src = baseURL + `dark_all/${zoom}/${x}/${y}.png`+apiKey;
                    }

                    img.addEventListener('load', () => { draw(); }, { once: true });
                    this.tileCache.set(tileKey, img);
                }

                if (img.complete && img.naturalWidth !== 0) {
                    const tileMaxLat = this.tile2lat(y, zoom);
                    const tileMinLat = this.tile2lat(y + 1, zoom);
                    const tileMinLon = this.tile2lon(x, zoom);
                    const tileMaxLon = this.tile2lon(x + 1, zoom);

                    const screenTopLeft = latLon2xy(tileMaxLat, tileMinLon);
                    const screenBottomRight = latLon2xy(tileMinLat, tileMaxLon);

                    const tileW = screenBottomRight.x - screenTopLeft.x;
                    const tileH = screenBottomRight.y - screenTopLeft.y;

                    ctx.drawImage(img, screenTopLeft.x, screenTopLeft.y, tileW, tileH);
                }
            }
        }

        ctx.restore(); // Restores context to full fidelity for UI overlays and data dots
    }};



const baseMap_Satellite = {
// Satellite imagery basemap. Uses Esri's free World Imagery tile service rather than
// Google's raw map tiles, since pulling Google's tiles directly (outside their JS API)
// is against Google's terms of service. Esri's service is designed for exactly this
// kind of direct, no-API-key tile access, and just asks for the attribution shown on screen.
    tileCache: new Map(),

    init() { console.log("Satellite imagery (Esri World Imagery) provider initialized."); },

    lon2tile: baseMap_OpenStreetMaps.lon2tile,
    lat2tile: baseMap_OpenStreetMaps.lat2tile,
    tile2lon: baseMap_OpenStreetMaps.tile2lon,
    tile2lat: baseMap_OpenStreetMaps.tile2lat,

    draw() {
        const zoom = Math.max(0, Math.min(19, Math.round(Math.log2(180 / view.latHeight))));

        const topLeftGeo = xy2latLon(0, 0);
        const bottomRightGeo = xy2latLon(canvas.width, canvas.height);

        const minTileX = this.lon2tile(topLeftGeo.lon, zoom);
        const maxTileX = this.lon2tile(bottomRightGeo.lon, zoom);
        const minTileY = this.lat2tile(topLeftGeo.lat, zoom);
        const maxTileY = this.lat2tile(bottomRightGeo.lat, zoom);

        ctx.save();

        // Esri's tile REST endpoint takes {level}/{row}/{column}, i.e. z/y/x (not z/x/y)
        const baseURL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/";

        for (let x = minTileX; x <= maxTileX; x++) {
            for (let y = minTileY; y <= maxTileY; y++) {
                const tileKey = `${zoom},${x},${y}`;
                let img = this.tileCache.get(tileKey);

                if (!img) {
                    img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.src = baseURL + `${zoom}/${y}/${x}`;
                    img.addEventListener('load', () => { draw(); }, { once: true });
                    this.tileCache.set(tileKey, img);
                }

                if (img.complete && img.naturalWidth !== 0) {
                    const tileMaxLat = this.tile2lat(y, zoom);
                    const tileMinLat = this.tile2lat(y + 1, zoom);
                    const tileMinLon = this.tile2lon(x, zoom);
                    const tileMaxLon = this.tile2lon(x + 1, zoom);

                    const screenTopLeft = latLon2xy(tileMaxLat, tileMinLon);
                    const screenBottomRight = latLon2xy(tileMinLat, tileMaxLon);

                    const tileW = screenBottomRight.x - screenTopLeft.x;
                    const tileH = screenBottomRight.y - screenTopLeft.y;

                    ctx.drawImage(img, screenTopLeft.x, screenTopLeft.y, tileW, tileH);
                }
            }
        }

        ctx.restore();
    }
};



const baseMap_CapturedLocal = {
// Object for drawing selected base local basemap images captured from google maps
    maps: [],

    init() {
        if (typeof BasemapsDir === 'undefined') return;

        const lines = BasemapsDir.trim().split(/\r?\n/);
        lines.forEach(line => {
            // Regex captures: 1:fileName, 2:lat, 3:lon, 4:zoomVal, 5:unit(z/m), 6:width, 7:height
            const match = line.match(/(basemap@([\d.-]+),([\d.-]+),([\d.]+)([mz])\s+(\d+)x(\d+)x(\d+(?:\.\d+)?))\.(?:png|jpe?g|webp)/);

            let fudgeFactor = 1.0
            const ffi = line.indexOf("ff=");
            if (ffi > 0){
                fudgeFactor = parseFloat(line.slice(ffi+3));
                line = line.slice(0,ffi)
            }

            if (match) {
                const fileName = line.trim()
                const lat = parseFloat(match[2]);
                const lon = parseFloat(match[3]);
                const val = parseFloat(match[4]);
                const unit = match[5];
                const imgW = parseInt(match[6]);
                const imgH = parseInt(match[7]);
                const imgScale = parseFloat(match[8]);

                let latH;
                if (unit === 'z') {
                    // Geographic height of the image in degrees:
                    // (180 degrees * image pixel height) / (256 * 2^zoom)
                    latH = (180 * imgH) / (256 * Math.pow(2, val));
                    latH = latH * 1.39/imgScale; // Scale fudge factor.
                } else {
                    // Meter-based: vertical ground distance / meters per degree
                    latH = val / 111120 * 0.72 * fudgeFactor;
                }

                // Geographic width in degrees (accounting for image aspect ratio)
                const lonW = latH * (imgW / imgH) / Math.cos(lat/180*3.14159);

                const entry = {
                    fileName: fileName,
                    fullPath: "basemaps/" + fileName,
                    img: new Image(),
                    lat, lon,
                    latH,
                    minLat: lat - (latH / 2),
                    maxLat: lat + (latH / 2),
                    minLon: lon - (lonW / 2),
                    maxLon: lon + (lonW / 2)
                };

                // Set the source so the browser can load it when needed
                //entry.img.src = entry.fullPath; // don't set src so it won't load yet.
                this.maps.push(entry);

                // Print the extents to the console
                console.log(`Basemap Loaded: ${entry.fileName}  ${imgW}x${imgH}`);
                console.log(`  Lat,Lon: ${entry.minLat.toFixed(6)} to ${entry.maxLat.toFixed(6)},  ${entry.minLon.toFixed(6)} to ${entry.maxLon.toFixed(6)}`);
            }else{
                console.log("no match:" , line)
            }
        });
    },

    // Filter basemaps by what overlaps the view port.
    draw() {
        // Current view bounds
        const b1 = xy2latLon(0, 0);
        const b2 = xy2latLon(canvas.width, canvas.height);
        const viewMinLat = b2.lat;
        const viewMaxLat = b1.lat;
        const viewMinLon = b1.lon;
        const viewMaxLon = b2.lon;
        const viewHeight = viewMaxLat - viewMinLat;

        // 1. Filter for overlap
        let visible = this.maps.filter(m => {
            return !(m.minLat > viewMaxLat || m.maxLat < viewMinLat ||
                     m.minLon > viewMaxLon || m.maxLon < viewMinLon);
        });

        // 2. Sort by latitude extent (largest to smallest)
        visible.sort((a, b) => b.latH - a.latH);

        let finalSet = [];

        for (let m of visible) {
            // f an image covers less than 10% of view height, skip if we have larger ones
            if (finalSet.length > 0 && m.latH < (viewHeight * 0.2)) continue;

            // If this image completely covers the viewport, don't draw bigger ones behind it
            if (m.minLat <= viewMinLat && m.maxLat >= viewMaxLat &&
                m.minLon <= viewMinLon && m.maxLon >= viewMaxLon) {
                finalSet = []; // Clear set to discard larger ones behind this one.
            }
            finalSet.push(m);

        }

        if (finalSet.length === 0) return;

        ctx.save();

        finalSet.forEach(m => {
            // Trigger loading image on demand
            if (!m.srcSet) {

                m.img.addEventListener('load', () => {
                    console.log(`Finished loading: ${m.fileName}`);
                    draw(); // Force a redraw now that the pixels are ready
                }, { once: true }); // Use {once: true} to auto-cleanup the listener

                m.img.src = m.fullPath;
                m.srcSet = true;
                console.log(`Lazy loading: ${m.fileName}`);
            }

            const topLeft = latLon2xy(m.maxLat, m.minLon);
            const bottomRight = latLon2xy(m.minLat, m.maxLon);

            const w = bottomRight.x - topLeft.x;
            const h = bottomRight.y - topLeft.y;

            ctx.drawImage(m.img, topLeft.x, topLeft.y, w, h);

            // Draw a rectangle around the map
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(topLeft.x, topLeft.y, w, h);
        });

        ctx.restore();
    }
};

// --- DRAWING & CLUSTERING ---
function updateVisibleData() {
    updateLatScale(view.latHeight)
    saveView();
    chronological.clear(); // Clear the chronological cache
    if (images.length === 0) return;
    const b1 = xy2latLon(0, 0);
    const b2 = xy2latLon(canvas.width, canvas.height);

    const maxLat = b1.lat;
    const minLat = b2.lat;
    const minLon = b1.lon;
    const maxLon = b2.lon;

    // Binary search for image of nearest longitude
    function findFirstLongitudeIndex(targetLon) {
        let low = 0, high = images.length;
        while (low < high) {
            let mid = (low + high) >>> 1;
            if (images[mid].lon < targetLon) low = mid + 1;
            else high = mid;
        }
        return low;
    }

    // Longitude range to filter by
    const startIndex = findFirstLongitudeIndex(minLon);
    let endIndex = findFirstLongitudeIndex(maxLon);
    if (endIndex < images.length) endIndex += 1;

    // Everything inside the map view
    const viewImgs = [];
    for (let i = startIndex; i < endIndex; i++) {
        const img = images[i];
        if (img.lat >= minLat && img.lat <= maxLat) viewImgs.push(img);
    }

    // Time and elevation filters each feed the OTHER histogram, and both apply to what is shown.
    const timeOk = img => img.timeMs >= overlayUI.filterStartMs && img.timeMs <= overlayUI.filterEndMs;
    elevUI.setRange(viewImgs);
    const elevFiltered = viewImgs.filter(img => elevUI.passes(img));
    const timeFiltered = viewImgs.filter(timeOk);
    overlayUI.updateTimeline(viewImgs, elevFiltered);
    elevUI.updateBins(timeFiltered);
    visibleImages = elevFiltered.filter(timeOk);

    const latRad = view.lat * Math.PI / 180;
    const pixelsPerMeter = canvas.height / (view.latHeight * 111120);

    const useJitter = pixelsPerMeter > 60;

    for (let i = 0; i < visibleImages.length; i++) {
        const img = visibleImages[i];
        const screenPos = latLon2xy(img.lat, img.lon);

        if (useJitter) {
            // Look ahead to find how many images share this exact coordinate
            let j = i + 1;
            while (j < visibleImages.length &&
                visibleImages[j].lat === img.lat && visibleImages[j].lon === img.lon) j++;

            let count = j - i;
            if (count > 1){
                if (count > 11) { // Sprial for 11+ points
                    let spacing = pixelsPerMeter * 0.03
                    for (let k=0; k < count; k++) {
                        const groupImg = visibleImages[i + k];

                        let rad = Math.sqrt(k + 1.5);
                        let theta = 4 * rad;
                        groupImg.x = screenPos.x + Math.cos(theta) * rad * spacing;
                        groupImg.y = screenPos.y + Math.sin(theta) * rad * spacing;
                    }
                }else{ // Evenly space images around a for 2-10 points
                    let radius = pixelsPerMeter * 0.1;
                    if (count >=6) count -= 1; // Don't offset last image so it falls in circle center
                    for (let k=0; k < count; k++) {
                        const groupImg = visibleImages[i + k];
                        let angle = ((k+0.5) / count) * Math.PI * 2;
                        groupImg.x = screenPos.x + Math.cos(angle) * radius;
                        groupImg.y = screenPos.y + Math.sin(angle) * radius;
                    }
                }
                i += count-1; // Skip the rest of the group in the outer loop
                continue;
            }
        }
        // Single point in location, or not using jitter.
        img.x = screenPos.x;
        img.y = screenPos.y;
    }

    if (useJitter){
        // Longitude sorted source data produces x-sorted data
        // but if we added x-y jitter, re-sorting is needed.
        visibleImages.sort((a, b) => a.x - b.x);
    }

    clusters = [];
    const baseRadius = 3;
    visibleImages.forEach(img => {
        let merged = false;

        if (!useJitter) { // Only cluster if we aren't zoomed in enough to use jitter
            for (let i = clusters.length - 1; i >= 0; i--) {
                const c = clusters[i];
                if (img.x - c.x > 50){
                    // Clusters end up naturally longitude sorted.  Looking further left
                    // won't find a cluster to combine with
                    break;
                }
                const d = Math.sqrt((img.x - c.x) ** 2 + (img.y - c.y) ** 2);
                if (d < c.radius*1.1) {
                    const w = c.count + 1;
                    c.x = (c.x * c.count + img.x) / w;
                    c.y = (c.y * c.count + img.y) / w;

                    c.count++;
                    c.radius = c.count > 3 ? baseRadius * Math.pow(c.count / 3, 1/3) : baseRadius;
                    c.hl += img.hl;
                    merged = true;
                    break;
                }
            }
        }

        if (!merged) {
            clusters.push({ x: img.x, y: img.y, count: 1, hl: img.hl, radius: baseRadius });
        }
    });

    // If a cluster has grown large enough, it might have swallowed previous clusters to its left
    // that were created before the cluster grew that big.  Iterate right to left
    // to see if large clusters swallow smaller older clusters to the left.
    if (!useJitter) {
        for (let i = clusters.length - 1; i >= 0; i--) {
            const cMain = clusters[i];
            if (cMain.count <= 3) continue; // Radius doesn't increase before 3, so would not have swallowed.

            // Check clusters to the left of cMain
            for (let j = i - 1; j >= 0; j--) {
                const cLeft = clusters[j];

                // Since they are longitude sorted, if the X distance is
                // greater than the combined radii, we can stop looking left.
                if (cMain.x - cLeft.x > (cMain.radius + cLeft.radius) * 1.5) break;

                const d = Math.sqrt((cMain.x - cLeft.x)**2 + (cMain.y - cLeft.y)**2);

                // If they overlap (using a 1.1x multiplier for a cleaner look)
                if (d < (cMain.radius + cLeft.radius) * 0.8) {
                    const totalCount = cMain.count + cLeft.count;

                    // Merge positions in Screen Space
                    cMain.x = (cMain.x * cMain.count + cLeft.x * cLeft.count) / totalCount;
                    cMain.y = (cMain.y * cMain.count + cLeft.y * cLeft.count) / totalCount;

                    cMain.count = totalCount;

                    cMain.hl += cLeft.hl;

                    // Recalculate radius based on new count
                    cMain.radius = cMain.count > 3 ? baseRadius * Math.pow(cMain.count / 3, 1/3) : baseRadius;

                    clusters.splice(j, 1); // Remove the merged cluster from the left

                    i--;  // Adjust 'i' because the array just got shorter
                }
            }
        }
    }

    if (currentPreview && !visibleImages.includes(currentPreview)) {
        // if currentPreviw got pushed off screen, also recalculat its X and Y so it gets pushed
        // off the visible rectangle.
        const pt = latLon2xy(currentPreview.lat, currentPreview.lon);
        currentPreview.x = pt.x;
        currentPreview.y = pt.y;
    }

    draw();
    overlayUI.draw();
    elevUI.draw();
}

// Photos passing the current time + elevation filters, regardless of the current pan/zoom
function getFilteredImages() {
    const timeOk = img => img.timeMs >= overlayUI.filterStartMs && img.timeMs <= overlayUI.filterEndMs;
    return images.filter(img => timeOk(img) && elevUI.passes(img));
}

// Pan/zoom the map so all of the given photos are in view, with a bit of padding
function fitViewToImages(imgs) {
    if (!imgs || imgs.length === 0) return;
    let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
    for (const img of imgs) {
        if (img.lat < minLat) minLat = img.lat;
        if (img.lat > maxLat) maxLat = img.lat;
        if (img.lon < minLon) minLon = img.lon;
        if (img.lon > maxLon) maxLon = img.lon;
    }
    view.lat = (minLat + maxLat) / 2;
    view.lon = (minLon + maxLon) / 2;

    const pad = 1.15; // 15% padding so points aren't right at the screen edge
    const latSpan = Math.max(0.0008, (maxLat - minLat) * pad); // minimum keeps a single photo from zooming in forever
    const lonSpan = Math.max(0.0008, (maxLon - minLon) * pad);
    const latHeightForLon = lonSpan * Math.cos(view.lat * Math.PI / 180) * (window.innerHeight / window.innerWidth);
    view.latHeight = Math.max(latSpan, latHeightForLon);

    updateVisibleData();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    ctx.translate(view.dragOffset.x, view.dragOffset.y); // for use while panning via a drag.

    if (view.pinchScale !== 1.0) { // Scaling relative to the original pinch center
        ctx.translate(view.pinchStartCenter.x, view.pinchStartCenter.y);
        ctx.scale(view.pinchScale, view.pinchScale);
        ctx.translate(-view.pinchStartCenter.x, -view.pinchStartCenter.y);
    }

    baseMap.draw()

    // Draw image points & clusters
    ctx.globalCompositeOperation = 'lighter';
    clusters.forEach(c => {
        if (c.hl)
            ctx.fillStyle = `rgba(255, 255, 144, 1)`;
        else {
            if (c.count == 1){
                ctx.fillStyle = `rgba(60, 140, 255, 0.6)`;
            }else if (c.count == 2){
                ctx.fillStyle = `rgba(60, 150, 255, 0.85)`;
            }else{
                ctx.fillStyle = `rgba(60, 180, 255, 1)`;
            }
        }
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    if (currentPreview) {
        ctx.globalCompositeOperation = 'source-over';
        if (currentPreview === selectedImage) {
            ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(currentPreview.x, currentPreview.y, 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(currentPreview.x, currentPreview.y, 3, 0, Math.PI * 2); ctx.fill();
    }

    if (lassoSelected.length > 0) {  // Mark each selected photo individually
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(255, 220, 0, 0.95)'; ctx.strokeStyle = 'rgba(90, 70, 0, 0.9)'; ctx.lineWidth = 1.5;
        lassoSelected.forEach(img => {
            ctx.beginPath(); ctx.arc(img.x, img.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        });
    }

    if (lassoBoxes.length > 0) {  // Outline of every selection box made so far
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = 'rgba(255, 220, 0, 0.95)'; ctx.fillStyle = 'rgba(255, 220, 0, 0.12)'; ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        lassoBoxes.forEach(poly => {
            ctx.beginPath();
            poly.forEach((pt, i) => { const q = latLon2xy(pt.lat, pt.lon); if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); });
            ctx.closePath(); ctx.fill(); ctx.stroke();
        });
        ctx.setLineDash([]);
    }

    ctx.restore();
}


function findNearestImage(x, y, threshold) {
// Find nearest image to the mouse pointer for highlight or selecting.
    if (visibleImages.length === 0) return null;

    // binary search to find the index closest to the target X coordinate as starting point
    let low = 0;
    let high = visibleImages.length;
    while (low < high) {
        let mid = (low + high) >>> 1;
        if (visibleImages[mid].x < x) low = mid + 1;
        else high = mid;
    }
    const startIndex = low;

    let nearest = null, minDist = threshold;
    let indices = [startIndex - 1, startIndex];
    let done = [false, false];

    while (!done[0] || !done[1]) {
        for (let i = 0; i < 2; i++) {
            if (done[i]) continue;
            const idx = indices[i];
            if (idx < 0 || idx >= visibleImages.length) { done[i] = true; continue; }

            const img = visibleImages[idx];
            // Use cached screen coordinates

            // Horizontal distance check (early exit for sorted list)
            if (Math.abs(img.x - x) > minDist) {
                done[i] = true;
                continue;
            }
            // First check bounding box
            if (Math.abs(img.y - y) < minDist) {
                // Full Euclidean distance check
                const d = Math.sqrt((img.x - x) ** 2 + (img.y - y) ** 2);
                if (d < minDist) {
                    minDist = d;
                    nearest = img;
                }
            }
            // Update index: i=0 moves left (-1), i=1 moves right (+1)
            indices[i] += (i === 0 ? -1 : 1);
        }
    }
    return nearest;
}

// Define bounds of time -- practically "infininitely past or future"
const startOfTimeMs = new Date("1980/01/01 00:00:00").getTime();
const endOfTimeMs = new Date("2100/01/01  00:00:00").getTime();

const overlayUI = {
    numBins: 128,
    bins: new Array(128).fill(0),
    maxBinValue: 0,
    numAllImagesLatLon: 0,  // Number of images with GPS coordinages (pre-filtering)
    lockedStartMs: null,    // Zoomed in histogram start and end times, null for auto.
    lockedEndMs: null,
    markersMovedSinceZoom: false, // Determines if 'z' or zoom button zooms in or out
    actualMinMs: 0,
    actualMaxMs: 0,
    startMs: new Date("2010/01/01 00:00:00").getTime(),
    endMs: new Date("2027/01/01 00:00:00").getTime(),

    filterStartMs: startOfTimeMs,
    filterEndMs: endOfTimeMs,
    startX: 0,
    endX: 0,
    selectedTimeMs: 0, // 0 when no image is selected
    histLeft: 10,
    timeSpan: 31536000000, // Default value 1 year of miliseconds


    updateTimeline: function(images, binImages) {
        binImages = binImages || images; // Histogram bars can use a narrower set than the axis range
        // Update histogram based on new set of visible images.
        this.bins.fill(0);
        this.maxBinValue = 0;
        this.numAllImagesLatLon = images.length;

        let minTime = Infinity;
        let maxTime = -Infinity;

        // Find min and max times efficiently
        for (let img of images) {
            if (img.timeMs == 0) continue;
            if (img.timeMs < minTime) minTime = img.timeMs;
            if (img.timeMs > maxTime) maxTime = img.timeMs;
        }

        this.actualMinMs = minTime;
        this.actualMaxMs = maxTime;

        // Round down to start of min year, round up to start of year AFTER max year
        const sYear = new Date(minTime).getFullYear();
        const eYear = new Date(maxTime).getFullYear();

        const autoStartMs = new Date(sYear + "/01/01 00:00:00").getTime();
        const autoEndMs = new Date((eYear + 1) + "/01/01 00:00:00").getTime();

        this.startMs = this.lockedStartMs !== null ? this.lockedStartMs : autoStartMs;
        this.endMs = this.lockedEndMs !== null ? this.lockedEndMs : autoEndMs;

        this.timeSpan = this.endMs - this.startMs;

        // Now bin the data.
        let maxBinValue = 0
        for (let img of binImages) {
            let index = Math.floor(((img.timeMs - this.startMs) / this.timeSpan) * this.numBins);
            if (index < 0 || index >= this.numBins) continue
            this.bins[index]++;
            if (this.bins[index] > maxBinValue) maxBinValue = this.bins[index];
        }
        if (maxBinValue === 0 && images.length > 0) maxBinValue = 1; // keep the time bar visible if a filter hides everything
        this.maxBinValue = maxBinValue;
    },


    zoomToggle: function() {
        if (this.lockedStartMs !== null && !this.markersMovedSinceZoom) {
            // Revert to automatic
            this.lockedStartMs = null;
            this.lockedEndMs = null;
            return true;
        }

        let leftTarget = this.filterStartMs;
        let rightTarget = this.filterEndMs;

        let isUnboundedLeft = (leftTarget <= startOfTimeMs);
        let isUnboundedRight = (rightTarget >= endOfTimeMs);

        if (isUnboundedLeft || isUnboundedRight) {
            const actualSpan = this.actualMaxMs - this.actualMinMs;
            const days180 = 180 * 24 * 60 * 60 * 1000;

            // Abort unbounded zoom if the actual data is > 180 days
            if (isUnboundedLeft && isUnboundedRight && actualSpan > days180) {
                return false;
            }

            if (isUnboundedLeft) leftTarget = this.actualMinMs;
            if (isUnboundedRight) rightTarget = this.actualMaxMs;
        }

        let span = rightTarget - leftTarget;
        if (span <= 0) return false;

        // Target span becomes 80% of the visual space
        let visualSpan = span / 0.9;

        this.lockedStartMs = leftTarget - (visualSpan * 0.05);
        this.lockedEndMs = rightTarget + (visualSpan * 0.05);
        this.markersMovedSinceZoom = false;

        return true;
    },

    updateZoomButton: function() {
        const zoomBtn = document.getElementById('zoom-btn');
        const resetBtn = document.getElementById('reset-timeline-btn');

        // Check if temporal filtering is currently active
        const isFiltered = this.filterStartMs > startOfTimeMs || this.filterEndMs < endOfTimeMs;
        const isZoomedIn = this.lockedStartMs !== null || this.lockedEndMs !== null;

        if (resetBtn) resetBtn.style.display = (isFiltered || isZoomedIn) ? 'block' : 'none';

        if (!zoomBtn) return;

        if (!isFiltered) {
            zoomBtn.style.display = 'none';
            return;
        }

        // Unhide the button since sliders are moved inward
        zoomBtn.style.display = 'block';

        // Determine state based on your existing zoom lock variables
        if (this.lockedStartMs !== null && !this.markersMovedSinceZoom) {
            zoomBtn.textContent = "time zoom out";
        } else {
            zoomBtn.textContent = "time zoom in";
        }
    },

    setFilterFromX: function(dragType, mouseX) {
        // Convert pixel to time
        this.markersMovedSinceZoom = true;
        let ratio = (mouseX - this.histLeft) / this.histWidth;
        let targetMs = this.startMs + (ratio * this.timeSpan);
        const minGap = this.timeSpan * 0.03; //minimum Min space between markers

        if (dragType === 'start-handle') {
            let targetMS = Math.min(targetMs, this.filterEndMs - minGap);
            // Snap left edge
            if (targetMS <= this.startMs + (this.timeSpan * 0.02)) targetMS = startOfTimeMs;
            this.filterStartMs = targetMS;
        } else if (dragType === 'end-handle') {
            let targetMS = Math.max(targetMs, this.filterStartMs + minGap);
            // Snap right edge
            if (targetMS >= this.endMs - (this.timeSpan * 0.02)) targetMS = endOfTimeMs;
            this.filterEndMs = targetMS;
        }

        // Unlock the zoom scale start or end to 'auto' if marker are dragged to the end of the scale.
        if (this.filterStartMs <= startOfTimeMs) this.lockedStartMs = null;
        if (this.filterEndMs >= endOfTimeMs) this.lockedEndMs = null;
    },

    drawTimeScale: function(histBottom) {
        overlayCtx.strokeStyle = 'rgba(255, 255, 255, 1)';
        overlayCtx.fillStyle = 'rgba(255, 255, 255, 1)';
        overlayCtx.font = '12px sans-serif';
        overlayCtx.textBaseline = 'top';
        overlayCtx.textAlign = 'center'; // Moved to the top to fix day label alignment

        const sYear = new Date(this.startMs).getFullYear();
        const eYearCap = new Date(this.endMs).getFullYear();

        let monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        const msPerDay = 24 * 60 * 60 * 1000;
        const msPerYear = 365.25 * msPerDay;
        const yearPixels = (msPerYear / this.timeSpan) * this.histWidth;
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        for (let year = sYear; year <= eYearCap; year++) {
            let currentMonthMs = new Date(year + "/01/01 00:00:00").getTime();

            for (let m = 0; m < 12; m++) {
                if (m > 0) {
                    currentMonthMs += monthDays[m - 1] * msPerDay;
                }

                if (m === 1) {
                    // Adjust February length to handle leap years
                    const march1 = new Date(year + "/03/01 00:00:00").getTime();
                    monthDays[1] = Math.round((march1 - currentMonthMs) / msPerDay);
                }
                let daysInThisMonth = monthDays[m];

                const monthEndMs = currentMonthMs + (daysInThisMonth * msPerDay);

                if (monthEndMs < this.startMs) continue;
                if (currentMonthMs > this.endMs) break;

                // Draw month tick
                if (currentMonthMs >= this.startMs && currentMonthMs <= this.endMs) {
                    let drawMonthTick = true;
                    if (yearPixels < 400) {
                        if (m % 6) {
                            if (m === 3 || m === 9) {
                                if (yearPixels <= 75) drawMonthTick = false;
                            } else {
                                if (yearPixels <= 150) drawMonthTick = false;
                            }
                        }
                    }

                    if (drawMonthTick) {
                        const x = ((currentMonthMs - this.startMs) / this.timeSpan) * this.histWidth + this.histLeft;
                        let tickLen = (m % 3 == 0) ? 10 : 6;

                        overlayCtx.beginPath();
                        overlayCtx.moveTo(x, histBottom);
                        overlayCtx.lineTo(x, histBottom + tickLen);
                        overlayCtx.stroke();

                        if (m === 0) {
                            let shortYear = (year % 100).toString().padStart(2, '0');
                            if (yearPixels > 50){
                                shortYear = year.toString();
                            }
                            overlayCtx.fillText(shortYear, x, histBottom + 12);
                        } else if (yearPixels > 150) {
                            overlayCtx.font = '12px sans-serif';
                            if (yearPixels > 500) {
                                overlayCtx.fillText(monthNames[m], x, histBottom + 12);
}                           else if (m % 3 == 0){
                                overlayCtx.fillText(monthNames[m], x, histBottom + 12); // Only quarterly month labels
                            }
                        }
                    }
                }

                // --- DRAW DAY TICKS ---
                if (yearPixels >= 600) {
                    overlayCtx.font = '11px sans-serif';
                    for (let d = 2; d <= daysInThisMonth; d++) {
                        const dayTickMs = currentMonthMs + (d - 1) * msPerDay;

                        if (dayTickMs < this.startMs) continue;
                        if (dayTickMs > this.endMs) break;

                        const isIntervalTick = (d === 16);

                        if (yearPixels >= 2000 || isIntervalTick) {
                            const x = ((dayTickMs - this.startMs) / this.timeSpan) * this.histWidth + this.histLeft;
                            let tickLen = isIntervalTick ? 6 : 3;

                            overlayCtx.beginPath();
                            overlayCtx.moveTo(x, histBottom);
                            overlayCtx.lineTo(x, histBottom + tickLen);
                            overlayCtx.stroke();

                            if ((yearPixels > 7000) || (yearPixels > 2000 && isIntervalTick)) {
                                overlayCtx.fillText(d.toString(), x, histBottom + 12);
                            }
                        }
                    }
                }
            }
        }
    },


    drawHistogram: function() {
        if (this.maxBinValue === 0) return;

        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        overlayCtx.fillStyle = 'rgba(60, 180, 255, 1)';

        const histHeight = 50;
        const histBottom = 100;
        this.histWidth = overlayCanvas.width-20; // Bar length leaves 10 pix on either end so legend below still fits.
        const barWidth = this.histWidth/this.numBins;

        // X positions of time filter start stop handles
        this.startX = ((this.filterStartMs - this.startMs) / this.timeSpan) * this.histWidth + this.histLeft;
        this.endX = ((this.filterEndMs - this.startMs) / this.timeSpan) * this.histWidth + this.histLeft;

        // Make sure handles are visible
        this.startX = Math.min(Math.max(this.startX,this.histLeft), this.histLeft+this.histWidth)
        this.endX = Math.min(Math.max(this.endX,this.histLeft), this.histLeft+this.histWidth)

        // Draw the time histogram bars.
        for (let i = 0; i < this.numBins; i++) {
            if (this.bins[i] > 0) {
                const barCenter = (i * barWidth) + (barWidth / 2)+this.histLeft
                if (barCenter >= this.startX && barCenter <= this.endX) { // Is between markers
                    overlayCtx.fillStyle = 'rgba(180, 180, 255, 1)'; // Bright (Selected)
                } else {
                    overlayCtx.fillStyle = 'rgba(180, 180, 255, 0.6)'; // Dim (Unselected)
                }

                let height = (this.bins[i] / this.maxBinValue) * histHeight;
                if (height < 2) height = 2; // Make sure the bar at least shows up.
                overlayCtx.fillRect(i * barWidth + this.histLeft, histBottom - 2 - height, barWidth, height);
            }
        }

        // Draw base line
        overlayCtx.strokeStyle = 'rgba(255, 255, 255, 1)';
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        overlayCtx.moveTo(10, histBottom);
        overlayCtx.lineTo(overlayCanvas.width-10, histBottom);
        overlayCtx.stroke();

        this.drawTimeScale(histBottom);

        // Draw Handles (5x12 "house" shape)
        const drawHandle = (x) => {
            overlayCtx.fillStyle = '#00ff00'; // UI Blue
            overlayCtx.strokeStyle = 'white'; // White outline
            overlayCtx.lineWidth = 1;

            overlayCtx.beginPath();  // draw house shaped pentagon for the marker.
            overlayCtx.moveTo(x, histBottom - 3);     // peak point
            overlayCtx.lineTo(x + 2.5, histBottom);
            overlayCtx.lineTo(x + 2.5, histBottom+9);
            overlayCtx.lineTo(x - 2.5, histBottom+9);
            overlayCtx.lineTo(x - 2.5, histBottom);
            overlayCtx.closePath();

            overlayCtx.fill();
            overlayCtx.stroke();
        };

        drawHandle(this.startX);
        drawHandle(this.endX);

        // --- DRAW SELECTED DATE RANGE TEXT ---
        const startD = new Date(this.filterStartMs);
        const endD = new Date(this.filterEndMs);

        // Helper to format "12 Aug 2026"
        const formatD = (d) => d.getDate() + ' ' + d.toLocaleString('en-US', { month: 'short' }) + ' ' + d.getFullYear();

        // Check against limits of range, which denote no filtering on this end of range
        const isStartBound = startD.getFullYear() <= 1980;
        const isEndBound = endD.getFullYear() >= 2100;

        let dateText = "";
        if (isStartBound && isEndBound) {
            dateText =  visibleImages.length+" images"
            dateText += "       move green pointers to filter by date"
        } else {
            if (isStartBound) {
                dateText = formatD(endD) + " or before:"
            } else if (isEndBound) {
                dateText = formatD(startD) + " and after:"
            } else {
                dateText = formatD(startD) + " -- " + formatD(endD);
            }
            dateText += "        "+visibleImages.length+" of "+this.numAllImagesLatLon +" shown"
        }

        overlayCtx.fillStyle = 'rgba(255, 255, 255, 1)';
        overlayCtx.font = 'italic 14px sans-serif';
        overlayCtx.textAlign = 'left';
        overlayCtx.fillText(dateText, 0, 130);

        // Draw a red line on the histogram for the time of the selected image
        if (this.selectedTimeMs > 0 && this.selectedTimeMs >= this.startMs && this.selectedTimeMs <= this.endMs) {
            const timeSpan = this.endMs - this.startMs;
            const lineX = this.histLeft + ((this.selectedTimeMs - this.startMs) / timeSpan) * this.histWidth;

            overlayCtx.strokeStyle = 'rgba(255, 120, 120, 1)'; // Bright red, slightly transparent
            overlayCtx.lineWidth = 3;

            overlayCtx.beginPath();
            // Draw from just above the tallest bar down to the axis
            overlayCtx.moveTo(lineX, histBottom+10);
            overlayCtx.lineTo(lineX, histBottom-2);
            overlayCtx.stroke();
        }
    },

    setSelectedTime: function(ms) {
        this.selectedTimeMs = ms;
        this.drawHistogram();
        this.drawScaleBar();
        elevUI.draw();
    },

    seekImageFromX: function(mouseX) {
        const timeSpan = this.endMs - this.startMs;
        // Calculate ratio relative to the histogram's padding
        let ratio = (mouseX - this.histLeft) / this.histWidth;
        ratio = Math.max(0, Math.min(1, ratio)); // Clamp safely between 0 and 1

        const targetMs = this.startMs + (ratio * timeSpan);

        //console.log("Histogram seek to time:"+(new Date(targetMs)).toLocaleString());
        return chronological.findNearestMsImage(targetMs);
    },

    drawScaleBar: function() {
    // draw a legend showing what the current scale is.
        const metersPerDegreeLat = 111132;
        // pixels per degree / meters per degree
        const metersPerPixel = view.latHeight * metersPerDegreeLat / canvas.height;

        const maxBarWidth = 300;
        const maxMeters = maxBarWidth * metersPerPixel;
        const steps = [1, 2, 5];
        let mag = Math.pow(10, Math.floor(Math.log10(maxMeters)));
        let bestMeters = 0;
        for (let i = 2; i >= 0; i--) {
            let test = steps[i] * mag;
            if (test <= maxMeters) { bestMeters = test; break; }
        }
        if (bestMeters === 0) bestMeters = mag / 2;
        const barWidth = bestMeters / metersPerPixel;
        const label = bestMeters >= 1000 ? (bestMeters / 1000) + " km" : bestMeters + " m";

        const x = 5, y = 30;
        overlayCtx.save(); overlayCtx.resetTransform();

        // Draw Scale Line
        overlayCtx.strokeStyle = "white"; overlayCtx.fillStyle = "white"; overlayCtx.lineWidth = 2; overlayCtx.font = "bold 14px sans-serif";
        overlayCtx.beginPath(); overlayCtx.moveTo(x, y-5); overlayCtx.lineTo(x, y+5); overlayCtx.moveTo(x, y); overlayCtx.lineTo(x+barWidth, y); overlayCtx.moveTo(x+barWidth, y-5); overlayCtx.lineTo(x+barWidth, y+5); overlayCtx.stroke();
        overlayCtx.textAlign = "center"; overlayCtx.fillText(label, x + (barWidth / 2), y - 15);


        // Position the satellite toggle button dynamically, next to the scale bar
        const satBtn = document.getElementById('satellite-btn');
        if (satBtn) {
            satBtn.style.left = "330px";
            satBtn.style.top = "25px"
            satBtn.style.display = 'block'; // Show it once calculated
        }

        overlayCtx.restore();
    },

    draw: function() {
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        this.drawHistogram();
        this.drawScaleBar();
        this.updateZoomButton();
    }
};

// --- ELEVATION FILTER: histogram + two range handles, drawn below the time bar ---
const elevUI = {
    numBins: 64,
    bins: new Array(64).fill(0),
    maxBinValue: 0,
    axisMin: 0, axisMax: 100, step: 20, // Meters at the left/right ends of the scale, and tick spacing
    filterMin: null, filterMax: null,   // null = no limit on that end
    numInScope: 0,   // Images in view that pass the time filter
    numNoAlt: 0,     // Of those, how many have no elevation
    histLeft: 10, histWidth: 380, histBottom: 60, histHeight: 45,
    startX: 10, endX: 390,

    isFiltered: function() { return this.filterMin !== null || this.filterMax !== null; },

    passes: function(img) {
        if (!this.isFiltered()) return true;
        if (img.alt === null) return false; // No elevation data: hidden while an elevation filter is active
        if (this.filterMin !== null && img.alt < this.filterMin) return false;
        if (this.filterMax !== null && img.alt > this.filterMax) return false;
        return true;
    },

    niceStep: function(x) {
        const mag = Math.pow(10, Math.floor(Math.log10(x)));
        const r = x / mag;
        return (r <= 1.5 ? 1 : r <= 3.5 ? 2 : r <= 7.5 ? 5 : 10) * mag;
    },

    setRange: function(imgs) {
        let lo = Infinity, hi = -Infinity;
        for (const img of imgs) {
            if (img.alt === null) continue;
            if (img.alt < lo) lo = img.alt;
            if (img.alt > hi) hi = img.alt;
        }
        if (lo > hi) { lo = altGlobalMin; hi = altGlobalMax; } // nothing with elevation in view: use overall range
        if (!(lo <= hi)) return;
        if (hi - lo < 20) { const mid = (lo + hi) / 2; lo = mid - 10; hi = mid + 10; }
        this.step = this.niceStep((hi - lo) / 4);
        this.axisMin = Math.floor(lo / this.step) * this.step;
        this.axisMax = Math.ceil(hi / this.step) * this.step;
    },

    updateBins: function(imgs) {
        this.bins.fill(0);
        this.maxBinValue = 0;
        this.numInScope = imgs.length;
        this.numNoAlt = 0;
        const span = this.axisMax - this.axisMin;
        for (const img of imgs) {
            if (img.alt === null) { this.numNoAlt++; continue; }
            let i = Math.floor((img.alt - this.axisMin) / span * this.numBins);
            if (i === this.numBins) i--;
            if (i < 0 || i >= this.numBins) continue;
            if (++this.bins[i] > this.maxBinValue) this.maxBinValue = this.bins[i];
        }
    },

    setFilterFromX: function(drag, mouseX) {
        const span = this.axisMax - this.axisMin;
        const ratio = Math.min(1, Math.max(0, (mouseX - this.histLeft) / this.histWidth));
        const target = this.axisMin + ratio * span;
        const gap = span * 0.03;
        if (drag === 'start') {
            const v = Math.min(target, (this.filterMax === null ? this.axisMax : this.filterMax) - gap);
            this.filterMin = (v <= this.axisMin + span * 0.02) ? null : Math.round(v); // snap to "no limit"
        } else {
            const v = Math.max(target, (this.filterMin === null ? this.axisMin : this.filterMin) + gap);
            this.filterMax = (v >= this.axisMax - span * 0.02) ? null : Math.round(v);
        }
    },

    draw: function() {
        if (!(altGlobalMin <= altGlobalMax)) { elevCanvas.style.display = 'none'; return; } // no elevation data
        elevCanvas.style.display = 'block';
        const c = elevCtx, span = this.axisMax - this.axisMin;
        const xOf = v => this.histLeft + (v - this.axisMin) / span * this.histWidth;
        const clampX = x => Math.min(Math.max(x, this.histLeft), this.histLeft + this.histWidth);
        const base = this.histBottom;
        c.clearRect(0, 0, elevCanvas.width, elevCanvas.height);

        this.startX = this.filterMin === null ? this.histLeft : clampX(xOf(this.filterMin));
        this.endX = this.filterMax === null ? this.histLeft + this.histWidth : clampX(xOf(this.filterMax));

        // Bars (orange, to tell them apart from the time bars)
        const barW = this.histWidth / this.numBins;
        for (let i = 0; i < this.numBins; i++) {
            if (this.bins[i] === 0) continue;
            const cx = this.histLeft + i * barW + barW / 2;
            c.fillStyle = (cx >= this.startX && cx <= this.endX) ? 'rgba(255, 190, 110, 1)' : 'rgba(255, 190, 110, 0.5)';
            const h = Math.max(2, this.bins[i] / this.maxBinValue * this.histHeight);
            c.fillRect(this.histLeft + i * barW, base - 2 - h, barW, h);
        }

        // Baseline, ticks and labels
        c.strokeStyle = 'white'; c.fillStyle = 'white'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(this.histLeft, base); c.lineTo(this.histLeft + this.histWidth, base); c.stroke();
        c.font = '12px sans-serif'; c.textBaseline = 'top';
        for (let v = this.axisMin; v <= this.axisMax + this.step * 0.001; v += this.step) {
            const x = xOf(v);
            c.beginPath(); c.moveTo(x, base); c.lineTo(x, base + 4); c.stroke();
            c.textAlign = (v <= this.axisMin) ? 'left' : (v + this.step > this.axisMax + this.step * 0.001 ? 'right' : 'center');
            c.fillText(Math.round(v).toLocaleString() + ' m', x, base + 12);
        }

        // Red mark for the selected photo's elevation
        const sel = (overlayUI.selectedTimeMs > 0 && currentPreview) ? currentPreview : null;
        if (sel && sel.alt !== null && sel.alt >= this.axisMin && sel.alt <= this.axisMax) {
            const x = xOf(sel.alt);
            c.strokeStyle = 'rgba(255, 120, 120, 1)'; c.lineWidth = 3;
            c.beginPath(); c.moveTo(x, base + 10); c.lineTo(x, base - 2); c.stroke();
        }

        // Green handles
        const handle = x => {
            c.fillStyle = '#00ff00'; c.strokeStyle = 'white'; c.lineWidth = 1;
            c.beginPath();
            c.moveTo(x, base - 3); c.lineTo(x + 2.5, base); c.lineTo(x + 2.5, base + 9);
            c.lineTo(x - 2.5, base + 9); c.lineTo(x - 2.5, base);
            c.closePath(); c.fill(); c.stroke();
        };
        handle(this.startX); handle(this.endX);

        // Status text
        let t;
        if (!this.isFiltered()) {
            t = 'drag green pointers to filter by elevation';
            if (this.numNoAlt > 0) t += '  (' + this.numNoAlt + ' lack elevation)';
        } else {
            const f = v => Math.round(v).toLocaleString() + ' m';
            if (this.filterMin === null) t = f(this.filterMax) + ' or below:';
            else if (this.filterMax === null) t = f(this.filterMin) + ' and above:';
            else t = f(this.filterMin) + ' -- ' + f(this.filterMax);
            t += '     ' + visibleImages.length + ' of ' + this.numInScope + ' shown';
        }
        c.fillStyle = 'white'; c.font = 'italic 13px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
        c.fillText(t, 0, 88);
    }
};

let activeElevDrag = null;
const elevPointerX = e => e.clientX - elevCanvas.getBoundingClientRect().left;
const nearestElevHandle = x => {
    const ds = Math.abs(x - elevUI.startX), de = Math.abs(x - elevUI.endX);
    return Math.min(ds, de) < 12 ? (ds <= de ? 'start' : 'end') : null;
};
elevCanvas.addEventListener('pointerdown', e => {

    else elevCanvas.style.cursor = nearestElevHandle(x) ? 'ew-resize' : 'default';
});
['pointerup', 'pointercancel'].forEach(t => elevCanvas.addEventListener(t, () => { activeElevDrag = null; }));
elevCanvas.addEventListener('dblclick', () => { elevUI.filterMin = null; elevUI.filterMax = null; updateVisibleData(); }); // reset

function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        if ((poly[i].y > y) !== (poly[j].y > y) &&
            x < (poly[j].x - poly[i].x) * (y - poly[i].y) / (poly[j].y - poly[i].y) + poly[i].x) inside = !inside;
    }
    return inside;
}

lassoCanvas.addEventListener('pointerup', () => {
    const pts = lassoPts;

    if (pts.length < 2 || Math.abs(pts[1].x - pts[0].x) < 5 || Math.abs(pts[1].y - pts[0].y) < 5) return; // Too small
    const x1 = Math.min(pts[0].x, pts[1].x), x2 = Math.max(pts[0].x, pts[1].x);
    const y1 = Math.min(pts[0].y, pts[1].y), y2 = Math.max(pts[0].y, pts[1].y);
    const corners = [{ x: x1, y: y1 }, { x: x2, y: y1 }, { x: x2, y: y2 }, { x: x1, y: y2 }];
